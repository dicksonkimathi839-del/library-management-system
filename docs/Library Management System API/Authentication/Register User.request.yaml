$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Test Patron",
      "email": "{{$randomEmail}}",
      "password": "LibraryPass123"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const data = pm.response.json();
        if (data.user && data.user.email) pm.collectionVariables.set('email', data.user.email);
      }
    language: text/javascript
order: 1000
